; Anwendungsserver fuer den Container. entry.sh startet uWSGI mit dieser
; Datei; sie fehlte bisher, weshalb das Image zwar baute, aber nicht ansprang.

[uwsgi]
chdir = /opt/grpproto
module = django_group_protocol.wsgi:application

; Auf 0.0.0.0, damit der Port aus dem Container heraus erreichbar ist.
; Vor der Anwendung steht hier kein nginx, deshalb spricht uWSGI HTTP.
http = 0.0.0.0:8000

master = true
processes = 4
threads = 2
; Worker nach 1000 Anfragen erneuern - haelt Speicherlecks in Grenzen.
max-requests = 1000
harakiri = 60
vacuum = true
die-on-term = true

; Django wirft nach dem Start keine eigenen Prozesse an; ohne das hier
; wuerde uWSGI beim Fehlstart schweigend weiterlaufen.
need-app = true

buffer-size = 16384
log-format = %(addr) %(method) %(uri) -> %(status) in %(msecs)ms
