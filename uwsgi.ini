; Anwendungsserver fuer den Container. entry.sh startet uWSGI mit dieser
; Datei; sie fehlte bisher, weshalb das Image zwar baute, aber nicht ansprang.

[uwsgi]
chdir = /opt/grpproto
module = django_group_protocol.wsgi:application

; Auf 0.0.0.0, damit der Port aus dem Container heraus erreichbar ist.
; Vor der Anwendung steht hier kein nginx, deshalb spricht uWSGI HTTP.
http = 0.0.0.0:8000

; Verbindungen offen halten.
;
; Ohne das hier schliesst uWSGI nach jeder Antwort. Node (undici, das fetch
; hinter den Server Components) haelt aber einen Verbindungspool und schreibt
; frueher oder spaeter in einen Socket, den uWSGI gerade zumacht:
;
;     TypeError: fetch failed
;       [cause]: SocketError: other side closed
;
; In einer Server Component eskaliert das zur ganzseitigen Fehlerseite -
; React-Fehler #441, "Da ist etwas schiefgelaufen" - obwohl die Aktion
; erfolgreich gespeichert wurde. Genau das ist im Arbeitsablauf-Test beim
; Statuswechsel passiert (W1).
;
; http-keepalive verlangt eine korrekte Content-Length; add-header sorgt
; dafuer, dass auch Antworten ohne eine solche sauber abgeschlossen werden.
http-keepalive = 30
http-auto-chunked = true
; Wie lange eine ruhende Verbindung offen bleibt. Muss ueber dem Wert liegen,
; den der Client verwendet - sonst greift dasselbe Rennen nur seltener.
http-timeout = 90
socket-timeout = 90

master = true
processes = 4
threads = 2
; Worker nach 1000 Anfragen erneuern - haelt Speicherlecks in Grenzen.
max-requests = 1000
harakiri = 60
vacuum = true
die-on-term = true

; Django wirft nach dem Start keine eigenen Prozesse an; ohne das hier
; wuerde uWSGI beim Fehlstart schweigend weiterlaufen.
need-app = true

buffer-size = 16384
log-format = %(addr) %(method) %(uri) -> %(status) in %(msecs)ms
